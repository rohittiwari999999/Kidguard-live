plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.kidguard_live"
    compileSdk flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.kidguard_live"
        minSdkVersion 24       // Android 7.0+ (Required for MediaProjection screen capture)
        targetSdkVersion 34    // Android 14
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias (System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias'] ?: 'upload')
            keyPassword (System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword'] ?: 'KidGuard2026Pass')
            storeFile (System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : file('upload-keystore.jks')))
            storePassword (System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword'] ?: 'KidGuard2026Pass')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

name: Build & Sign Android APK and AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify Flutter & Android Environment
        run: flutter doctor -v

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: 7. Configure key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=${KEYSTORE_PASSWORD:-KidGuard2026Pass}
          keyPassword=${KEY_PASSWORD:-KidGuard2026Pass}
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF
          echo "key.properties configured."

      - name: 8. Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release

      - name: 9. Build Signed AAB (Android App Bundle for Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release

      - name: 10. Upload Signed APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidGuard-Signed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 11. Upload Signed AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidGuard-Signed-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 12. Create GitHub Release (On Tag or Manual Trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
